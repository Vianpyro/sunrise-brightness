# Builds the binaries of a tag and publishes its release: the Linux binary and .deb, the Windows
# executable, their SHA256SUMS and build provenance attestations. Started by version.yml with a
# dispatch on the tag, or by a tag pushed by hand. A dispatch on a branch builds without publishing:
# the binaries are left as the run's artifacts.
# The asset names are the ones the README links to: keep them stable.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: its glibc is the oldest the binary runs on
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            binary: sunrise-brightness
            asset: sunrise-brightness-linux
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            binary: sunrise-brightness.exe
            asset: sunrise-brightness-windows.exe
    steps:
      - if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A tag pushed by hand on the wrong commit would publish another version under its name
      - name: Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Cargo.toml is at $version, the tag is $GITHUB_REF_NAME"
            exit 1
          fi

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - if: runner.os == 'Linux'
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deb@3.8.0

      # No cache: a release is built from nothing, so no earlier run can slip into it
      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir dist
          cp "target/release/$BINARY" "dist/$ASSET"
          if [ "$RUNNER_OS" = Linux ]; then
            cargo deb --no-build --locked
            cp target/debian/*.deb dist/
          fi
          ls -l dist

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      # The notes list the pull requests and commits since the previous release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$REPO"
          --title "Version ${TAG#v}"
          --generate-notes
          --verify-tag
